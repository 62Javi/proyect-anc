version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENV=dev
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "8083:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
