version: '3.8'
services:
  backend:
    build:
      context: ./backend
      network: host
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENV=dev

  frontend:
    build:
      context: ./frontend
      network: host
    ports:
      - "8083:80"
    depends_on:
      - backend
